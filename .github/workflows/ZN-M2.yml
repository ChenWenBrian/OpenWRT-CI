# 专属兆能 ZN-M2 (No WiFi / 1GB RAM) 编译工作流
name: ZN-M2

# CI 计划：仅纯手工触发，避免浪费 GitHub Actions 额度
on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

# CI 权限
permissions: write-all

# CI 任务
jobs:
  config:
    name: ZN-M2-NOWIFI
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [ZN-M2-NOWIFI]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    # 调用公用编译核心 WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 编译配置 (仅包含 ZN-M2)
      WRT_CONFIG: ${{matrix.CONFIG}}
      # 默认主题设为 argon
      WRT_THEME: argon
      # 默认主机名
      WRT_NAME: ZN-M2
      # 默认WIFI名称 (无WIFI模式仅作占位)
      WRT_SSID: OWRT
      # 默认WIFI密码
      WRT_WORD: 12345678
      # 默认管理IP
      WRT_IP: 192.168.31.1
      # 默认密码
      WRT_PW: 无
      # 源码链接 (跟踪 snapshot)
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      # 源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      # 源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      # 插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      # 仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
